name: CI

on:
  push:
  pull_request:

jobs:
  format:
    name: format
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - run: pipx install clang-format==22.1.8

      - run: clang-format --version

      - run: |
          find include src tests samples \( -name '*.c' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run -Werror

  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-26.04'
        run: >
          sudo apt-get update && sudo apt-get install -y
          build-essential git make pkg-config cmake ninja-build gnome-desktop-testing
          libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
          libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev
          libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev
          libthai-dev libusb-1.0-0-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev
          liburing-dev mesa-vulkan-drivers xvfb

      - name: Configure (Ubuntu)
        if: matrix.os == 'ubuntu-26.04'
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBK_WERROR=ON

      - name: Configure (macOS)
        if: matrix.os == 'macos-latest'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBK_WERROR=ON

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        run: cmake -S . -B build -G "Visual Studio 18 2026" -T ClangCL -DCMAKE_BUILD_TYPE=Release -DBK_WERROR=ON

      - name: Build
        run: cmake --build build --config Release

      - name: clang-tidy (Ubuntu)
        if: matrix.os == 'ubuntu-26.04'
        continue-on-error: true
        run: |
          cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          find include src tests samples -name '*.h' -o -name '*.c' | xargs clang-tidy -p build

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release -E "test_app_lifecycle|test_app_init_failure|test_gfx_pipeline|test_gfx_capture|test_gfx_buffer|test_gfx_texture|test_gfx_compute"

      - name: Test (GPU-dependent, Ubuntu)
        if: matrix.os == 'ubuntu-26.04'
        continue-on-error: true
        run: xvfb-run ctest --test-dir build --output-on-failure -C Release -R "test_app_lifecycle|test_app_init_failure|test_gfx_pipeline|test_gfx_capture|test_gfx_buffer|test_gfx_texture|test_gfx_compute"

      - name: Test (GPU-dependent, macOS/Windows)
        if: matrix.os != 'ubuntu-26.04'
        continue-on-error: true
        run: ctest --test-dir build --output-on-failure -C Release -R "test_app_lifecycle|test_app_init_failure|test_gfx_pipeline|test_gfx_capture|test_gfx_buffer|test_gfx_texture|test_gfx_compute"

      - name: Smoke test sample (Ubuntu)
        if: matrix.os == 'ubuntu-26.04'
        continue-on-error: true
        run: xvfb-run build/samples/01_clear/01_clear --frames 120

  debug-sanitizers:
    name: debug-sanitizers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-26.04'
        run: >
          sudo apt-get update && sudo apt-get install -y
          build-essential git make pkg-config cmake ninja-build gnome-desktop-testing
          libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
          libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev
          libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev
          libthai-dev libusb-1.0-0-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev
          liburing-dev mesa-vulkan-drivers xvfb

      - name: Configure (Ubuntu)
        if: matrix.os == 'ubuntu-26.04'
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBK_WERROR=ON

      - name: Configure (macOS)
        if: matrix.os == 'macos-latest'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBK_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure -E "test_app_lifecycle|test_app_init_failure|test_gfx_pipeline|test_gfx_capture|test_gfx_buffer|test_gfx_texture|test_gfx_compute"

      - name: Test (GPU-dependent, Ubuntu)
        if: matrix.os == 'ubuntu-26.04'
        continue-on-error: true
        run: xvfb-run ctest --test-dir build --output-on-failure -R "test_app_lifecycle|test_app_init_failure|test_gfx_pipeline|test_gfx_capture|test_gfx_buffer|test_gfx_texture|test_gfx_compute"

      - name: Test (GPU-dependent, macOS)
        if: matrix.os != 'ubuntu-26.04'
        continue-on-error: true
        run: ctest --test-dir build --output-on-failure -R "test_app_lifecycle|test_app_init_failure|test_gfx_pipeline|test_gfx_capture|test_gfx_buffer|test_gfx_texture|test_gfx_compute"
